<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cannal · Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <div class="auth-tela">
    <div class="auth-card">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Cannal" class="auth-logo">
      <h1>Entrar no Cannal</h1>

      {% if erro %}<div class="auth-erro">{{ erro }}</div>{% endif %}

      <form method="POST">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autofocus>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required>
        </div>
        <button type="submit" class="btn-auth">Entrar</button>
      </form>

      <div class="auth-link">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></div>
    </div>
  </div>
</body>
</html>
