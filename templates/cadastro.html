<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cannal · Criar conta</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <div class="auth-tela">
    <div class="auth-card">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Cannal" class="auth-logo">
      <h1>Criar conta no Cannal</h1>

      {% if erro %}<div class="auth-erro">{{ erro }}</div>{% endif %}

      <form method="POST">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" value="{{ nome }}" required autofocus>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" value="{{ email }}" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required minlength="6">
        </div>
        <div class="campo">
          <label for="confirmar">Confirmar senha</label>
          <input type="password" id="confirmar" name="confirmar" required minlength="6">
        </div>
        <button type="submit" class="btn-auth">Criar conta</button>
      </form>

      <div class="auth-link">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></div>
    </div>
  </div>
</body>
</html>
